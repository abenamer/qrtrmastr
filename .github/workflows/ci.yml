name: CI
# The security review on every commit (ADR 0002). Pull requests are the only way into main, so
# every commit that reaches main has passed every job below; the push trigger covers the merge
# commit itself. Actions are pinned to a commit so a moved tag cannot change what runs.
#
# scripts/check.sh is the one list of the checks (REAS-DOC-006): a step below calls a group of
# it, and `scripts/check.sh lists` fails when a step runs a command of the script by itself.
# Three jobs are actions with no command of their own: deny, secrets and dependency-review.
#
# The seven jobs are required by branch protection, and a job that is skipped counts there as
# passed. So no job here has a condition, except the dependency review, which has nothing to
# read outside a pull request; `lists` fails on any other `if`, `needs`, `continue-on-error` or
# `shell` line in its plain spelling. The daily scan is a workflow of its own, scan.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job gets a read-only token; no job writes to the repository, so no checkout keeps the
# token in the workspace that the repository's own scripts and tests run in.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qm
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: qrtrmastr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://qm:ci@localhost:5432/qrtrmastr_ci
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml names the toolchain, and rustup follows that file for every cargo
      # call in the checkout. The version below must be the same one, so that this step
      # installs what the later steps use; the step after it fails when the two differ. A
      # newer stable Clippy can report other findings than the pinned one, so the toolchain
      # moves in a pull request of its own, not on the day of a release.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        id: toolchain
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - name: The workflow and rust-toolchain.toml name the same toolchain (REAS-DATA-004)
        env:
          INSTALLED: ${{ steps.toolchain.outputs.name }}
        run: scripts/check.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Format, compile, lint, unit tests, doc tests, documentation build
        run: scripts/check.sh rust
      - name: Migrate an empty database; the checked-query metadata matches the migrations (REAS-DATA-004)
        run: scripts/check.sh sqlx
      - name: Every test target, with the integration tests
        run: scripts/check.sh database

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec database
        run: scripts/check.sh audit

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check
          arguments: --all-features

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No real receipt or dump is tracked and no fixture carries personal data
        run: scripts/check.sh privacy
      - name: The guard hook refuses the commands it documents, and the check script passes its test
        run: scripts/check.sh hooks
      - name: This workflow and the Stop hook name no check outside scripts/check.sh
        run: scripts/check.sh lists

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - name: The documentation checker and its tests
        run: scripts/check.sh docs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
