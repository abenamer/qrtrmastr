name: CI
# The security review on every commit (ADR 0002). Pull requests are the only way into main, so
# every commit that reaches main has passed every job below; the push trigger covers the merge
# commit itself. Actions are pinned to a commit so a moved tag cannot change what runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job gets a read-only token; no job writes to the repository.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qm
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: qrtrmastr_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://qm:ci@localhost:5432/qrtrmastr_ci
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: sqlx-cli@0.9.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Migrate an empty database
        run: cargo sqlx migrate run
      - name: Checked-query metadata matches the migrations (REAS-DATA-004)
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec database
        run: cargo audit --file Cargo.lock

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: No real receipt or dump is tracked and no fixture carries personal data
        run: scripts/pii_canary.sh
      - name: The guard hook refuses the commands it documents
        run: bash .claude/hooks/guard-bash.test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-docs.txt
      - name: Check the OKF bundle and its links
        run: python scripts/check_docs.py
      - name: Checker tests
        run: python -m unittest discover -s tests/docs -t . -v

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
