name: Daily scan
# An advisory arrives without a change to the code (REAS-SEC-001): the two scans of the
# dependencies run once a day on the default branch, and by hand. A failed run sends a
# notification; it blocks nothing. The jobs have their own names, so that a result here is
# never taken for a required check of a pull request. scripts/check.sh lists reads this file
# as it reads ci.yml.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against the RustSec database
        run: scripts/check.sh audit

  daily-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check
          arguments: --all-features
