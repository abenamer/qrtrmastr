[package]
name = "qrtrmastr"
version = "0.1.0"
edition = "2024"
description = "Quartermaster: grocery order history from receipt emails, and a recommended next cart"
license = "MIT"
default-run = "qm"

[lib]
name = "qrtrmastr"
path = "src/lib.rs"

[[bin]]
name = "qm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
dotenvy = "0.15.7"
ego-tree = "0.11"
figment = { version = "0.10.19", features = ["toml", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
jiff = { version = "1.0.1", features = ["serde"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres"] }
mail-parser = "1.0.1"
regex = "1.13.1"
rust_decimal = { version = "1.43.0", features = ["serde"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "rust_decimal", "json"] }
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
rstest = "0.28.0"
tempfile = "3.27.0"
toml = "1.2.1"

# The lint levels that REAS 1.6.0-draft names, declared once (REAS-RUST-006). CI runs Clippy with
# `-D warnings`, so a `warn` here fails the `rust` job as a `deny` does; the two levels differ
# only in a local build. Suppress a lint with `#[expect(lint, reason = "...")]`, never `#[allow]`.
# `clippy.toml` leaves `unwrap` and `expect` free in test code, which REAS-RUST-005 excludes.
[lints.rust]
unsafe_code = "forbid"                         # REAS-SEC-004
missing_docs = "deny"                          # REAS-RUST-009
# `lint_canary` is the flag of examples/lint_canary.rs, the planted violations of this table.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(lint_canary)"] }

[lints.clippy]
wildcard_enum_match_arm = "deny"               # REAS-RUST-001
same_name_method = "deny"                      # REAS-RUST-003
needless_pass_by_value = "warn"                # REAS-RUST-004
redundant_clone = "warn"                       # REAS-RUST-004
unwrap_used = "deny"                           # REAS-RUST-005, REAS-SEC-002
expect_used = "warn"                           # REAS-RUST-005
allow_attributes = "deny"                      # REAS-RUST-006
allow_attributes_without_reason = "deny"       # REAS-RUST-006
undocumented_unsafe_blocks = "deny"            # REAS-SEC-004
multiple_unsafe_ops_per_block = "deny"         # REAS-SEC-004
arithmetic_side_effects = "deny"               # REAS-SEC-003
indexing_slicing = "deny"                      # REAS-SEC-003
string_slice = "deny"                          # REAS-SEC-003: a cut of a text by position
missing_errors_doc = "deny"                    # REAS-RUST-009
missing_panics_doc = "deny"                    # REAS-RUST-009
float_arithmetic = "deny"                      # REAS-RUST-008: no arithmetic on a float

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
# An overflow in arithmetic on a number from a receipt panics; it does not wrap (REAS-SEC-003).
overflow-checks = true
