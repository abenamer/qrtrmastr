[package]
name = "qrtrmastr"
version = "0.1.0"
edition = "2024"
description = "Quartermaster: grocery order history from receipt emails, and a recommended next cart"
license = "MIT"
default-run = "qm"

[lib]
name = "qrtrmastr"
path = "src/lib.rs"

[[bin]]
name = "qm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["toml", "env"] }
hex = "0.4.3"
mail-parser = "1.0.1"
regex = "1.13.1"
rust_decimal = { version = "1.43.0", features = ["serde"] }
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "rust_decimal", "json"] }
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
rstest = "0.28.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
