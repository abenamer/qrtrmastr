[package]
name = "reas-trust-boundary"
version = "0.1.0"
edition = "2021"
# Verified with `cargo +1.88.0 check` (REAS-DATA-004).
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# REAS-SEC-004: no unsafe code in this crate. REAS-RUST-009: public items are documented.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# REAS-SEC-003: every size from outside data goes through checked arithmetic
# and `get`, never `+` or `[..]`. REAS-SEC-002: a parse failure becomes a
# typed error, never a panic.
[lints.clippy]
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"

# REAS-SEC-003: an unchecked overflow panics in release instead of wrapping.
[profile.release]
overflow-checks = true
